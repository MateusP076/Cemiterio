<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Cadastrar Setor</title>
    <link rel="stylesheet" th:href="@{/css/estilo.css}" />
</head>
<body>
    <h2>Cadastrar Novo Setor</h2>
    <form method="post" th:action="@{/sector/criar}" th:object="${sector}">
        <label>Nome:</label>
        <input type="text" name="sectorname" required><br>

        <label>Descrição:</label>
        <input type="text" name="sectorDescription" required><br>

        <label>Condição:</label>
        <input type="text" name="sectorCondition"  required><br>

        <button type="submit">Salvar</button>
    </form>
<p th:if="${mensagem != null}" th:text="${mensagem}" style="color:green;"></p>
</body>
</html>
