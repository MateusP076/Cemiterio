<!DOCTYPE html>
<html lang="en">
    <html xmlns:th="http//www.thymeleaf.org">       
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" th:href="@{/css/estilo.css}" type="text/css" media="all">
    <title>Excluir User</title>
</head>
<body>
    <div class="container-cadastro">
        <div class="container">
            <h2>Excluir o Usuário</h2>
    
            <form  method="post">
                <!-- Campo para buscar o usuário pelo ID -->
                <div class="form-group">
                    <label for="iduser">ID do Usuário:</label>
                    <input type="text" id="iduser" name="iduser" placeholder="Digite o ID do usuário" required>
                    <button type="button" id="searchBtn" class="btn-search">Pesquisar</button>
                </div>
    
                <!-- Campos para editar o usuário -->
                <div class="form-group">
                    <label for="username">Nome de Usuário:</label>
                    <input type="text" id="username" name="username" placeholder="Digite o nome de usuário" readonly>
                </div>
    
                <div class="form-group">
                    <label for="password">Senha:</label>
                    <input type="password" id="password" name="password" placeholder="Digite a nova senha" readonly>
                </div>
    
                <div class="form-group">
                    <label for="email">E-mail:</label>
                    <input type="email" id="email" name="email" placeholder="Digite o novo e-mail" readonly>
                </div>
    
                <div class="form-group">
                    <label for="phone">Telefone:</label>
                    <input type="text" id="phone" name="phone" placeholder="Digite o novo telefone" readonly>
                </div>
    
                <div class="form-group">
                    <label for="address">Endereço:</label>
                    <input type="text" id="address" name="address" placeholder="Digite o novo endereço" readonly>
                </div>
    
                <div class="form-group">
                    <label for="role">Função:</label>
                    <select id="role" name="role" readonly  >
                        <option value="USER">Usuário</option>
                        <option value="ADMIN">Administrador</option>
                    </select>
                </div>
    
                <button type="submit" class="btn">Excluir</button>
            </form>
        </div>
    </div>
</body>
</html>
