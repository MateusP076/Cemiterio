<!DOCTYPE html>
<html lang="en">
<html xmlns:th="http//www.thymeleaf.org">    
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" th:href="@{/css/estilo.css}" type="text/css" media="all">
    
</head>
<body >
    <div class="container-cadastro">
    <div class="container">
    <h2>Cadastro de Usuário</h2>

    <form th:action="@{/User/cadastro}"  th:object="${UserModel}" method="post" th:if="${UserModel != null} ">
        
        <div class="form-group">
            <label for="username">Nome de Usuário:</label>
            <input type="text" id="username"  th:field="${UserModel.username}"  placeholder="Digite seu nome de usuário" required>
        </div>
        
        <div class="form-group">
            <label for="password">Senha:</label>
            <input type="password" id="password" th:field="${UserModel.password}"  placeholder="Digite sua senha" required>
        </div>
        
        <div class="form-group">
            <label for="email">E-mail:</label>
            <input type="email" id="email" th:field="${UserModel.email}" placeholder="Digite seu e-mail" required>
        </div>
        
        <div class="form-group">
            <label for="phone">Telefone:</label>
            <input type="text" id="phone" th:field="${UserModel.phone}" placeholder="Digite seu telefone" required>
        </div>
        
        <div class="form-group">
            <label for="address">Endereço:</label>
            <input type="text" id="address" th:field="${UserModel.address}" placeholder="Digite seu endereço" required>
        </div>
        
        <div class="form-group">
            <label for="role">Função:</label>
            <select id="role" th:field="${UserModel.role}" required>
                <option value="USER">Usuário</option>
                <option value="ADMIN">Administrador</option>
                <option value="Gravedigger">Coveiro</option>
            </select>
        </div>

        <button type="submit" class="btn">Cadastrar</button>
    </form>
<p th:if="${mensagem != null}" th:text="${mensagem}" style="color:green;"></p>
</div>
</div>
</body>
</html>
