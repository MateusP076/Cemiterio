<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Pesquisar Usuário</title>
    <link rel="stylesheet" th:href="@{/css/estilo.css}" />
</head>
<body>
<div class="container-cadastro">
    <div class="container">
        <h2>Atualizar Dados do Usuário</h2>

        <!-- Formulário de pesquisa por ID -->
        <form th:action="@{/User/Listar}" method="get">
            <div class="form-group">
                <label for="iduser">ID do Usuário:</label>
                <input type="text" id="iduser" name="iduser" placeholder="Digite o ID do usuário" required>
                <button type="submit" class="btn-search">Pesquisar</button>
            </div>
        </form>

        <!-- Formulário com dados preenchidos -->
        <div th:if="${usuario != null}">
            <h3>Dados do Usuário</h3>
            <p><strong>ID:</strong> <span th:text="${usuario.id}"></span></p>
            <p><strong>Nome de Usuário:</strong> <span th:text="${usuario.username}"></span></p>
            <p><strong>E-mail:</strong> <span th:text="${usuario.email}"></span></p>
            <p><strong>Telefone:</strong> <span th:text="${usuario.phone}"></span></p>
            <p><strong>Endereço:</strong> <span th:text="${usuario.address}"></span></p>
            <p><strong>Função:</strong> <span th:text="${usuario.role}"></span></p>
        </div>

        <!-- Exibe mensagem caso o usuário não seja encontrado -->
        <div th:if="${notFound}">
            <p style="color:red;">Usuário não encontrado.</p>
        </div>
    </div>
</div>
</body>
</html>
