<!DOCTYPE html>
<html lang="pt-br" >
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Pesquisar Usuário</title>
    <link rel="stylesheet" th:href="@{/css/estilo.css}" />
</head>
<body>
<div class="container-cadastro">
    <div class="container">
        <h2>Atualizar Dados do Usuário</h2>

        <form th:action="@{/User/Listar}" th:object="${UserModel}" method="get">
            <div class="form-group">
                <label for="iduser">ID do Usuário:</label>
                <input type="text" id="iduser" th:field="*{iduser}" placeholder="Digite o ID do usuário" required>
                <button type="submit" class="btn-search">Pesquisar</button>
            </div>
        
            <div class="form-group">
                <label for="username">Nome de Usuário:</label>
                <input type="text" id="username" th:field="*{username}" readonly>
            </div>
        
            <div class="form-group">
                <label for="password">Senha:</label>
                <input type="password" id="password" th:field="*{password}" readonly>
            </div>
        
            <div class="form-group">
                <label for="email">E-mail:</label>
                <input type="email" id="email" th:field="*{email}" readonly>
            </div>
        
            <div class="form-group">
                <label for="phone">Telefone:</label>
                <input type="text" id="phone" th:field="*{phone}" readonly>
            </div>
        
            <div class="form-group">
                <label for="address">Endereço:</label>
                <input type="text" id="address" th:field="*{address}" readonly>
            </div>
        
            <div class="form-group">
                <label for="role">Função:</label>
                <select id="role" th:field="*{role}" disabled>
                    <option value="USER">Usuário</option>
                    <option value="ADMIN">Administrador</option>
                </select>
            </div>
        </form>
        
    </div>
</div>
</div>
</body>
</html>
